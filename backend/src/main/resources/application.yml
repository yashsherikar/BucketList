server:
  port: ${PORT:8080}

spring:
  application:
    name: wishroom-backend
  profiles:
    active: dev

  jackson:
    default-property-inclusion: non_null

---
# ------------------- DEV PROFILE (default, H2 in-memory, zero setup) -------------------
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:wishroom;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
  jwt:
    secret: "dev-only-change-me-dev-only-change-me-32chars-min"
    expiration-ms: 604800000 # 7 days
  rapidapi:
    key: ${RAPIDAPI_KEY:}

---
# ------------------- PROD PROFILE (Postgres, used on Render/Railway/etc.) -------------------
spring:
  config:
    activate:
      on-profile: prod
  main:
    lazy-initialization: true
  jmx:
    enabled: false
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://your-frontend.vercel.app}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  rapidapi:
    key: ${RAPIDAPI_KEY:}
